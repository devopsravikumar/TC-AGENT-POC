name: Setup Docker and TeamCity Server+Agent on GCP VM via WinRM

# on:
  push:
    branches:
     - tc-agent-poc

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: teamcity-windows-poc
  VM_NAME: teamcity-vm
  GCS_BUCKET: tc-agent-poc
  DOCKER_PS1: install-docker.ps1
  TC_INSTALLER: installation-files_2023.11.5_TeamCity-2023.11.5.exe

jobs:
  setup-teamcity:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Authenticate to GCP using WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/123456789012/locations/global/workloadIdentityPools/github-pool/providers/github'
          service_account: 'gha-runner-sa@teamcity-windows-poc.iam.gserviceaccount.com'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Get VM External IP
        id: getip
        shell: pwsh
        run: |
          $ip = (gcloud compute instances describe $env:VM_NAME --project $env:PROJECT_ID --zone us-central1-a --format="value(networkInterfaces[0].accessConfigs[0].natIP)")
          echo "VM_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download install-docker.ps1 from GCS
        run: gsutil cp gs://%GCS_BUCKET%/%DOCKER_PS1% .

      - name: Download TeamCity Installer from GCS
        run: gsutil cp gs://%GCS_BUCKET%/%TC_INSTALLER% .

      - name: Copy install-docker.ps1 to VM via WinRM
        shell: pwsh
        run: |
          $secpasswd = ConvertTo-SecureString "${{ secrets.WINDOWS_PASSWORD }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential ("${{ secrets.WINDOWS_USERNAME }}", $secpasswd)
          $session = New-PSSession -ComputerName $env:VM_IP -Credential $cred -Authentication Basic
          Copy-Item -Path "./${{ env.DOCKER_PS1 }}" -Destination "C:\Users\${{ secrets.WINDOWS_USERNAME }}\Desktop" -ToSession $session
          Remove-PSSession $session

      - name: Copy TeamCity Installer to VM via WinRM
        shell: pwsh
        run: |
          $secpasswd = ConvertTo-SecureString "${{ secrets.WINDOWS_PASSWORD }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential ("${{ secrets.WINDOWS_USERNAME }}", $secpasswd)
          $session = New-PSSession -ComputerName $env:VM_IP -Credential $cred -Authentication Basic
          Copy-Item -Path "./${{ env.TC_INSTALLER }}" -Destination "C:\Users\${{ secrets.WINDOWS_USERNAME }}\Desktop" -ToSession $session
          Remove-PSSession $session

      - name: Run install-docker.ps1 via WinRM
        shell: pwsh
        run: |
          $secpasswd = ConvertTo-SecureString "${{ secrets.WINDOWS_PASSWORD }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential ("${{ secrets.WINDOWS_USERNAME }}", $secpasswd)
          Invoke-Command -ComputerName $env:VM_IP -Credential $cred -Authentication Basic -ScriptBlock {
            powershell.exe -ExecutionPolicy Bypass -File "C:\Users\${{ secrets.WINDOWS_USERNAME }}\Desktop\install-docker.ps1"
          }

      - name: Run TeamCity Installer via WinRM
        shell: pwsh
        run: |
          $secpasswd = ConvertTo-SecureString "${{ secrets.WINDOWS_PASSWORD }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential ("${{ secrets.WINDOWS_USERNAME }}", $secpasswd)
          Invoke-Command -ComputerName $env:VM_IP -Credential $cred -Authentication Basic -ScriptBlock {
            Start-Process -FilePath "C:\Users\${{ secrets.WINDOWS_USERNAME }}\Desktop\installation-files_2023.11.5_TeamCity-2023.11.5.exe" -ArgumentList "/S" -Wait
          }

      - name: Done
        run: echo "Docker and TeamCity setup complete via WinRM!"
