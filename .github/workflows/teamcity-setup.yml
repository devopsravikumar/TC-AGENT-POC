name: Install Docker + TeamCity Server + Agent

on:
  push:
    branches:
     - tc-agent-poc

jobs:
  install-teamcity:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1

      - name: Get TeamCity VM External IP
        id: get_ip
        run: |
          $ip = (gcloud compute instances describe teamcity-vm --zone=${{ secrets.GCP_ZONE }} `
                --format="value(networkInterfaces[0].accessConfigs[0].natIP)")
          echo "ip=$ip" >> $env:GITHUB_OUTPUT

      # ---- OPTIONAL: Copy Compose file to VM over SMB ----
      - name: Copy Docker Compose File to VM
        run: |
          $vmIp = "${{ steps.get_ip.outputs.ip }}"
          $user = "Administrator"
          $password = "${{ secrets.WINDOWS_VM_PASSWORD }}"

          # Map admin share (requires firewall and SMB to be enabled)
          net use \\$vmIp\C$ $password /user:$user
          copy .\teamcity-compose.yml \\$vmIp\C$\teamcity-compose.yml

      # ---- OPTIONAL: Run Docker Compose on remote VM using SchTasks ----
      - name: Run Docker Compose on VM (using SchTasks)
        run: |
          $vmIp = "${{ steps.get_ip.outputs.ip }}"
          $user = "Administrator"
          $password = "${{ secrets.WINDOWS_VM_PASSWORD }}"

          schtasks /S $vmIp /U $user /P $password /Create /TN "TeamCityInstall" `
            /TR "powershell -Command 'docker compose -f C:\teamcity-compose.yml up -d'" `
            /SC ONCE /ST 00:00 /F

      # ---- OPTIONAL: Clean up mapped drive ----
      - name: Clean up admin share mapping
        if: always()
        run: |
          $vmIp = "${{ steps.get_ip.outputs.ip }}"
          net use \\$vmIp\C$ /delete
