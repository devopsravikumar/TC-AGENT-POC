name: Setup Docker and TeamCity Server+Agent on GCP VM

on:
  workflow_dispatch:

env:
  PROJECT_ID: teamcity-windows-poc
  VM_NAME: teamcity-vm
  GCS_BUCKET: tc-agent-poc
  DOCKER_PS1: install-docker.ps1
  TC_INSTALLER: installation-files_2023.11.5_TeamCity-2023.11.5.exe

jobs:
  setup-teamcity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP using WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/315696147629/locations/global/workloadIdentityPools/github-pool/providers/github'
          service_account: 'gha-runner-sa@teamcity-windows-poc.iam.gserviceaccount.com'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Get VM External IP
        id: getip
        run: |
          gcloud compute instances describe $VM_NAME \
            --project $PROJECT_ID \
            --zone us-central1-a \
            --format="value(networkInterfaces[0].accessConfigs[0].natIP)" > vmip.txt
          echo "VM_IP=$(cat vmip.txt)" >> $GITHUB_ENV

      - name: Download install-docker.ps1 from GCS
        run: |
          gsutil cp gs://$GCS_BUCKET/$DOCKER_PS1 .

      - name: Download TeamCity Installer from GCS
        run: |
          gsutil cp gs://$GCS_BUCKET/$TC_INSTALLER .

      - name: Copy install-docker.ps1 to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.VM_IP }}
          username: ${{ secrets.WINDOWS_USERNAME }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: 22
          source: "install-docker.ps1"
          target: "C:\\Users\\${{ secrets.WINDOWS_USERNAME }}\\Desktop"

      - name: Copy TeamCity Installer to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.VM_IP }}
          username: ${{ secrets.WINDOWS_USERNAME }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: 22
          source: "${{ env.TC_INSTALLER }}"
          target: "C:\\Users\\${{ secrets.WINDOWS_USERNAME }}\\Desktop"

      - name: Install Docker on VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VM_IP }}
          username: ${{ secrets.WINDOWS_USERNAME }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: 22
          script: |
            powershell.exe -ExecutionPolicy Bypass -File "C:\\Users\\${{ secrets.WINDOWS_USERNAME }}\\Desktop\\install-docker.ps1"

      - name: Install TeamCity Server (silent install)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VM_IP }}
          username: ${{ secrets.WINDOWS_USERNAME }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: 22
          script: |
            powershell.exe -Command "Start-Process -FilePath 'C:\\Users\\${{ secrets.WINDOWS_USERNAME }}\\Desktop\\installation-files_2023.11.5_TeamCity-2023.11.5.exe' -ArgumentList '/S' -Wait"

      - name: Done
        run: echo "Docker and TeamCity setup complete!"
