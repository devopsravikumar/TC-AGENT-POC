name: Install Docker + TeamCity Server + Agent

on:
  push:
    branches:
     - tc-agent-poc

jobs:
  install-teamcity:
    runs-on: windows-latest

    env:
      GCP_ZONE: us-central1-a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Authenticate to Google Cloud using service account key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Install gcloud CLI
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1

      # Optional: List VMs for debug
      - name: List all VMs in project/zone
        run: |
          gcloud compute instances list --filter="name=('teamcity-vm')"

      # Get TeamCity VM External IP
      - name: Get TeamCity VM External IP
        id: get_ip
        shell: pwsh
        run: |
          $ip = (gcloud compute instances describe teamcity-vm --zone=${{ env.GCP_ZONE }} --format="value(networkInterfaces[0].accessConfigs[0].natIP)")
          echo "ip=$ip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Copy Docker Compose file to VM using SMB (requires firewall/SMB enabled)
      - name: Copy Docker Compose File to VM
        shell: pwsh
        run: |
          $vmIp = "${{ steps.get_ip.outputs.ip }}"
          $user = "Administrator"
          $password = "${{ secrets.WINDOWS_VM_PASSWORD }}"

          net use \\$vmIp\C$ $password /user:$user
          copy .\teamcity-compose.yml \\$vmIp\C$\teamcity-compose.yml

      # Run Docker Compose on VM (via SchTasks)
      - name: Run Docker Compose on VM (using SchTasks)
        shell: pwsh
        run: |
          $vmIp = "${{ steps.get_ip.outputs.ip }}"
          $user = "Administrator"
          $password = "${{ secrets.WINDOWS_VM_PASSWORD }}"

          schtasks /S $vmIp /U $user /P $password /Create /TN "TeamCityInstall" `
            /TR "powershell -Command 'docker compose -f C:\teamcity-compose.yml up -d'" `
            /SC ONCE /ST 00:00 /F

      # Clean up admin share mapping
      - name: Clean up admin share mapping
        if: always()
        shell: pwsh
        run: |
          $vmIp = "${{ steps.get_ip.outputs.ip }}"
          net use \\$vmIp\C$ /delete
