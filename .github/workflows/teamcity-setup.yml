name: TeamCity Deploy via GCS

on:
  workflow_dispatch:

jobs:
  upload-compose-and-trigger:
    runs-on: ubuntu-latest

    env:
      GCP_ZONE: us-central1-a
      GCS_BUCKET: tc-agent-poc  # <-- CHANGE THIS TO YOUR BUCKET NAME

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Upload Compose file to GCS
        run: |
          gsutil cp ./teamcity-compose.yml gs://${{ env.GCS_BUCKET }}/teamcity-compose.yml

      - name: Get TeamCity VM External IP
        id: get_ip
        run: |
          export IP=$(gcloud compute instances describe teamcity-vm --zone=${GCP_ZONE} --format="value(networkInterfaces[0].accessConfigs[0].natIP)")
          echo "ip=$IP" >> $GITHUB_OUTPUT

      # Optionally: Remotely trigger file download and docker compose on Windows VM via WinRM/SSH
      # Or, instruct user to run the following on the VM (best for cloud-init/startup.ps1):

      - name: Output VM PowerShell instructions
        run: |
          echo 'On the Windows VM, run the following PowerShell to download and launch TeamCity:'
          echo ''
          echo 'gsutil cp gs://${{ env.GCS_BUCKET }}/teamcity-compose.yml C:\teamcity-compose.yml'
          echo 'docker compose -f C:\teamcity-compose.yml up -d'
          echo ''
          echo 'Or, add these to your startup.ps1!'

      # If you have WinRM configured and want to automate the remote execution, add the relevant WinRM action here.

