name: TeamCity GCP Image Bake and Agent Launch

# on:
#   push:
#     branches:
#       - tc-agent-poc

jobs:
  bake-and-launch:
    name: Bake Image and Launch Agent
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/315696147629/locations/global/workloadIdentityPools/gha-pool/providers/github-actions'
          service_account: 'gha-runner-sa@teamcity-windows-poc.iam.gserviceaccount.com'

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Stop Base VM to Prepare Image
        run: |
          gcloud compute instances stop teamcity-vm \
            --zone=us-central1-a \
            --project=teamcity-windows-poc

      - name: Create Custom Image from Base VM
        run: |
          gcloud compute images create teamcity-win2022-full-image \
            --source-disk=teamcity-vm \
            --source-disk-zone=us-central1-a \
            --project=teamcity-windows-poc \
            --family=teamcity-windows \
            --guest-os-features=WINDOWS \
            --storage-location=us

      - name: Launch New TeamCity Agent VM
        run: |
          gcloud compute instances create teamcity-agent-1 \
            --zone=us-central1-a \
            --machine-type=n1-standard-4 \
            --image=teamcity-win2022-full-image \
            --image-project=teamcity-windows-poc \
            --boot-disk-size=100GB \
            --tags=teamcity-agent \
            --scopes=https://www.googleapis.com/auth/cloud-platform
