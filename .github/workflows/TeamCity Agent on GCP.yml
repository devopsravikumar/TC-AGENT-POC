name: Elastic TeamCity Agent on GCP (Windows, Docker, WIF)

on:
  push:
    branches:
      - tc-agent-poc
    inputs:
      agent_name:
        description: 'Agent name'
        required: false
        default: 'gha-docker-agent'

jobs:
  elastic-agent:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for WIF

    steps:
      # 1. Authenticate to GCP using WIF
      - name: Authenticate to GCP using WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # 2. Install Google Cloud SDK
      - name: Install gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Create Windows VM for TeamCity Agent
      - name: Create Windows VM with Docker for TeamCity Agent
        id: create_vm
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ZONE: us-central1-a   # <--- change as needed
          AGENT_NAME: ${{ github.event.inputs.agent_name }}
          IMAGE_NAME: 'teamcity-win2022-full-image'  # <--- your image
          IMAGE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          TC_SERVER_IP: ${{ secrets.TC_SERVER_IP }}
        run: |
          VM_NAME=${AGENT_NAME:-gha-docker-agent}-$RANDOM
          echo "VM_NAME=$VM_NAME" >> $GITHUB_ENV

          gcloud compute instances create "$VM_NAME" \
            --project="$GCP_PROJECT" \
            --zone="$GCP_ZONE" \
            --machine-type="n1-standard-4" \
            --image="$IMAGE_NAME" \
            --image-project="$IMAGE_PROJECT" \
            --boot-disk-size="100GB" \
            --metadata=windows-startup-script-ps1="docker run -d --restart=always --name $VM_NAME -e SERVER_URL='http://$TC_SERVER_IP:8111' -e AGENT_NAME='$VM_NAME' jetbrains/teamcity-agent:windowsservercore-1809" \
            --scopes=https://www.googleapis.com/auth/cloud-platform

      # 4. (Optional) Wait for the agent to register (polling TeamCity REST API)
      - name: Wait for Agent Registration in TeamCity
        env:
          TC_SERVER_IP: ${{ secrets.TC_SERVER_IP }}
          VM_NAME: ${{ env.VM_NAME }}
        run: |
          echo "Polling TeamCity server for agent $VM_NAME..."
          for i in {1..20}; do
            AGENT_PRESENT=$(curl -s "http://$TC_SERVER_IP:8111/httpAuth/app/rest/agents" | grep -i "$VM_NAME" || true)
            if [ -n "$AGENT_PRESENT" ]; then
              echo "Agent registered!"
              exit 0
            fi
            echo "Agent not found yet. Waiting 30s..."
            sleep 30
          done
          echo "Timeout waiting for agent registration."
          exit 1

      # 5. (Optional) Decommission the VM after the build
      - name: Delete VM after build (cleanup)
        if: always()
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ZONE: us-central1-a   # <--- change as needed
          VM_NAME: ${{ env.VM_NAME }}
        run: |
          echo "Deleting VM $VM_NAME..."
          gcloud compute instances delete "$VM_NAME" --project="$GCP_PROJECT" --zone="$GCP_ZONE" --quiet

