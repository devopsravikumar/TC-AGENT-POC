name: Install MCR and TeamCity on Windows VM

on:
  push:
    branches:
     - tc-agent-poc

permissions:
  contents: read
  id-token: write

jobs:
  install-mcr-teamcity:
    runs-on: windows-latest

    steps:
      # 1. Checkout the repo (if needed for scripts/config)
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Authenticate to GCP using Workload Identity Federation (OIDC)
      - name: Authenticate to GCP using WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/315696147629/locations/global/workloadIdentityPools/gha-pool/providers/github-actions'
          service_account: 'gha-runner-sa@teamcity-windows-poc.iam.gserviceaccount.com'

      # 3. Ensure Google Cloud SDK/gsutil is available
      - name: Ensure Google Cloud SDK & gsutil available
        shell: pwsh
        run: |
          $gcloudBin = "C:\Program Files (x86)\Google\Cloud SDK\google-cloud-sdk\bin"
          $gsutilCmd = Join-Path $gcloudBin "gsutil.cmd"
          if (-not (Test-Path $gsutilCmd)) {
            Write-Host "Google Cloud SDK (gsutil) not found. Installing..."
            Invoke-WebRequest -Uri "https://dl.google.com/dl/cloudsdk/channels/rapid/GoogleCloudSDKInstaller.exe" -OutFile "$env:TEMP\GoogleCloudSDKInstaller.exe"
            Start-Process -FilePath "$env:TEMP\GoogleCloudSDKInstaller.exe" -ArgumentList "/S" -Wait
            if (-not (Test-Path $gsutilCmd)) {
              throw "gsutil not found after install at $gsutilCmd"
            }
          } else {
            Write-Host "Google Cloud SDK (gsutil) is already available."
          }

      # 4. Activate Application Default Credentials (fix for gsutil/401 error)
      - name: Activate Application Default Credentials
        shell: pwsh
        run: |
          $gcloudBin = "C:\Program Files (x86)\Google\Cloud SDK\google-cloud-sdk\bin"
          $gcloudCmd = Join-Path $gcloudBin "gcloud.cmd"
          & $gcloudCmd auth application-default login --quiet

      # 5. Download Mirantis Container Runtime offline installer from GCS
      - name: Download MCR Offline Installer from GCS
        shell: pwsh
        run: |
          $gcloudBin = "C:\Program Files (x86)\Google\Cloud SDK\google-cloud-sdk\bin"
          $gsutilCmd = Join-Path $gcloudBin "gsutil.cmd"
          $bucketPath = "gs://tc-agent-poc/mcr-offline"
          $localFolder = "$env:RUNNER_TEMP\mcr-offline"
          & $gsutilCmd -m cp -r "$bucketPath/*" $localFolder

    #   # 6. Download TeamCity installer from GCS
    #   - name: Download TeamCity Installer from GCS
    #     shell: pwsh
    #     run: |
    #       $gcloudBin = "C:\Program Files (x86)\Google\Cloud SDK\google-cloud-sdk\bin"
    #       $gsutilCmd = Join-Path $gcloudBin "gsutil.cmd"
    #       $bucketPath = "gs://tc-agent-poc/teamcity-installer"
    #       $localFolder = "$env:RUNNER_TEMP\teamcity-installer"
    #       & $gsutilCmd -m cp -r "$bucketPath/*" $localFolder

      # 7. Copy installers to remote Windows VM via SMB
      - name: Copy to Remote Windows VM (SMB)
        shell: pwsh
        env:
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          REMOTE_VM: ${{ secrets.REMOTE_VM }}
        run: |
          $username = $env:VM_USERNAME
          $password = $env:VM_PASSWORD
          $remoteVM = $env:REMOTE_VM
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($username, $securePassword)
          New-PSDrive -Name Z -PSProvider FileSystem -Root "\\$remoteVM\C$" -Credential $credential -ErrorAction Stop
          # Copy MCR installer
          Copy-Item -Path "$env:RUNNER_TEMP\mcr-offline\*" -Destination "Z:\mcr-offline" -Recurse -Force
          # Copy TeamCity installer
          Copy-Item -Path "$env:RUNNER_TEMP\teamcity-installer\*" -Destination "Z:\teamcity-installer" -Recurse -Force
          Remove-PSDrive -Name Z

      # 8. Trigger MCR install on remote VM (PsExec)
      - name: Trigger MCR Install on Remote VM (PsExec)
        shell: pwsh
        env:
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          REMOTE_VM: ${{ secrets.REMOTE_VM }}
        run: |
          $psexec = "C:\tools\PSTools\PsExec.exe"
          $username = $env:VM_USERNAME
          $password = $env:VM_PASSWORD
          $remoteVM = $env:REMOTE_VM
          & $psexec \\$remoteVM -u $username -p $password powershell -ExecutionPolicy Bypass -File "C:\mcr-offline\install.ps1" -Offline

      # 9. Trigger TeamCity install on remote VM (PsExec)
      - name: Trigger TeamCity Install on Remote VM (PsExec)
        shell: pwsh
        env:
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          REMOTE_VM: ${{ secrets.REMOTE_VM }}
        run: |
          $psexec = "C:\tools\PSTools\PsExec.exe"
          $username = $env:VM_USERNAME
          $password = $env:VM_PASSWORD
          $remoteVM = $env:REMOTE_VM
          & $psexec \\$remoteVM -u $username -p $password "C:\teamcity-installer\installation-files_2023.11.5_TeamCity-2023.11.5.exe" /S
